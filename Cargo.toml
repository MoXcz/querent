[workspace]
resolver = "3"
members = ["crates/sql_db", "crates/querent", "crates/sql_lsp", "crates/sql_text", "crates/sql_dbt", "crates/sql_iceberg"]

[workspace.package]
edition = "2024"
version = "0.5.0"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
sql_db = { path = "crates/sql_db" }
sql_text = { path = "crates/sql_text" }
sql_lsp = { path = "crates/sql_lsp" }
sql_dbt = { path = "crates/sql_dbt" }
sql_iceberg = { path = "crates/sql_iceberg" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mssql-tds = { version = "=0.4.0", default-features = false, features = ["integrated-auth"] }
azure_identity = "1"
azure_core = "1"
gpui-kit = { version = "=0.10.0", features = ["tree-sitter-sql"] }
directories = "6"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
csv = "1"
tokio-postgres = "0.7.18"
postgres-native-tls = "0.5.3"
native-tls = "0.2"
futures-util = "0.3"
snowflake-connector-rs = { version = "1.1.1", default-features = false, features = ["key-pair-auth"] }
tree-sitter = "0.26.13"
tree-sitter-sequel = "0.3.13"
lsp-types = "=0.97.0"
sqlformat = "0.5"
rusqlite = { version = "0.43.0", features = ["bundled", "column_decltype"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form", "json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"
keyring = "=4.2.0"
semver = "1"
minisign-verify = "0.3"
self-replace = "1.5"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
ignore = "0.4.34"
regex = "1.13"
trash = "5"
iceberg = "0.11"
iceberg-catalog-rest = "0.11"
# The same major version as the iceberg crate uses, so its record batches are these types.
arrow-array = "58"
arrow-schema = "58"
arrow-cast = "58"
reqwest-rest-catalog = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
redundant_clone = "deny"
wildcard_enum_match_arm = "warn"
mod_module_files = "deny"

[profile.release]
# One codegen unit and thin LTO cut the binary by a third; symbols are stripped.
lto = "thin"
codegen-units = 1
strip = "symbols"
